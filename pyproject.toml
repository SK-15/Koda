[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "coordinator", "llm", "memory", "tools", "infra"]

[project]
name = "koda"
version = "0.1.0"
description = "Knowledge-Oriented Developer Agent"
requires-python = ">=3.11"

dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-ollama>=0.1.0",
    "pyyaml>=6.0.0",

    # LLM routing (Phase 3)
    "litellm>=1.40.0",

    # Observability
    "langfuse>=4.0.0",
    "langchain>=1.0.0",

    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",

    # Auth (Phase 3)
    "pyjwt>=2.8.0",

    # Search
    "tavily-python>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
