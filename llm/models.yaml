providers:
  anthropic:
    api_key: ${ANTHROPIC_KEY}
    models:
      - claude-sonnet-4-5
      - claude-haiku-4-5

  openai:
    api_key: ${OPENAI_KEY}
    models:
      - gpt-4o
      - gpt-4o-mini

  gemini:
    api_key: ${GOOGLE_KEY}
    models:
      - gemini-1.5-pro
      - gemini-1.5-flash

  deepseek:
    api_key: ${DEEPSEEK_KEY}
    models:
      - deepseek-chat
      - deepseek-coder

  ollama:
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    models:
      - qwen2.5-coder:7b
      - deepseek-r1:8b
      - llama3.2

  kimi:
    api_key: ${KIMI_KEY}
    base_url: https://api.moonshot.ai/v1
    models:
      - kimi-k3
      - kimi-k2.7-code
      - kimi-k2.7-code-highspeed
      - kimi-k2.6

default_model: kimi/kimi-k2.7-code-highspeed
fallback_model: ollama/qwen2.5-coder:7b